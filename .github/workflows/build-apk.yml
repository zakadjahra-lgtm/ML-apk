name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Slint desktop build deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Unit tests
        run: cargo test --lib

  apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo apk build --lib --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: MCLauncher-apk
          path: target/debug/apk/*.apk

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MC Launcher (latest build)
          prerelease: true
          body: "Debug APK built automatically from the latest commit on main."
          files: target/debug/apk/*.apk
