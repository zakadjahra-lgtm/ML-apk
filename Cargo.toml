[package]
name = "mc_launcher"
version = "0.1.0"
edition = "2021"
description = "Offline Minecraft Java launcher core in Rust with a Slint UI (Android + desktop)"

[lib]
name = "mc_launcher"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "mc_launcher_desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.8", features = ["backend-android-activity-06"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
anyhow = "1"

[build-dependencies]
slint-build = "1.8"

# ---- Android packaging (cargo-apk) ----
[package.metadata.android]
package = "dev.mclauncher.app"
apk_name = "MCLauncher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "MC Launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.release]
opt-level = "s"
lto = true
strip = true
